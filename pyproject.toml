[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cdb"
version = "0.2.0"
description = "Compact binary format for IPv4 geolocation ranges built from MaxMind MMDB databases"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rodion Kuzmin", email = "r.kuzmin.w@gmail.com" }]
dependencies = ["maxminddb>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[project.urls]
Repository = "https://github.com/gabkaclassic/cdb"

[tool.setuptools]
packages = ["cdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
